# WebSocket 升级判定：仅当请求带 Upgrade 头时才回 Connection: upgrade。
# 不能对 /api/ 无条件写死 Connection "upgrade"——那会让普通 HTTP 请求也走升级语义，
# 破坏 keep-alive 与部分代理链路。map 是 http 上下文指令，须定义在 server 块之外。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(\.git|\.env|\.svn|\.user\.ini|\.htaccess) {
        return 404;
    }

    # 前端生产环境 VITE_GLOB_API_URL=/api，去掉 /api 前缀后转发给微服务网关
    location /api/ {
        proxy_pass http://ypbin-gateway:18080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 小程序实时通道（/api/miniapp/*/ws/**）复用本 location：
        # 不带 Upgrade 头时 $connection_upgrade=close，普通 HTTP 行为不变；
        # 带 Upgrade 时按 WS 升级，并按长连接放宽读超时（否则默认 60s 会被掐断）。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
