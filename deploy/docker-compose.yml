services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ypbin_admin
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ypbin_admin
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      ADMIN_BOOTSTRAP_ENABLED: "true"
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?请在 .env 设置初始管理员密码}
      ADMIN_BOOTSTRAP_REAL_NAME: 平台管理员
      ADMIN_BOOTSTRAP_TENANT_ID: 1
      ADMIN_JOB_RECONCILE_DELAY: ${ADMIN_JOB_RECONCILE_DELAY:-30000}
      API_CRYPTO_KEY: ${API_CRYPTO_KEY:-}
      AI_MODEL_SECRET_KEY: ${AI_MODEL_SECRET_KEY:?请在 .env 设置 AI_MODEL_SECRET_KEY（16/24/32 字节）}
      AI_SIMPLE_STORE_PATH: ${AI_SIMPLE_STORE_PATH:-data/ai/simple-vector-store.json}
      LICENSE_ISSUER_PUBLIC_KEY: ${LICENSE_ISSUER_PUBLIC_KEY:-}
      LICENSE_ISSUER_PRIVATE_KEY: ${LICENSE_ISSUER_PRIVATE_KEY:-}
      LICENSE_ISSUER_SM4_KEY: ${LICENSE_ISSUER_SM4_KEY:-}
      YPBIN_WEB_CORS_ENABLED: "${YPBIN_CORS_ENABLED:-false}"
      YPBIN_WEB_CORS_ALLOWED_ORIGIN_PATTERNS: "${YPBIN_CORS_ORIGINS:-http://localhost:*}"
      TZ: Asia/Shanghai
    volumes:
      - admin-data:/opt/ypbin/ypbin-admin/data
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  admin-ui:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../../admin-ui-dist:/usr/share/nginx/html:ro
      - ../../ypbin-admin-ui/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ADMIN_UI_PORT:-18080}:80"
    depends_on:
      - admin

volumes:
  mysql-data:
  admin-data:
