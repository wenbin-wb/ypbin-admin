# ypbin-admin 微服务版本地部署环境
#
# 用法：
#   docker compose -f docker-compose.yml up -d
#
# 说明：本文件编排基础设施（Nacos/Redis/MySQL/Sentinel）+ 微服务四件套 + 网关，
# 单文件即可拉起全链路。账号密码一律从 .env 注入。

services:
  # ---------- 基础设施 ----------
  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: ypbin-nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_TOKEN: V6km96ahL8f9qnJAsjXdwKcFedfH85D+U4LzKmzz9z8kn5yb4sp7HMmt0a91rTKW
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8080:8080"
    volumes:
      - ypbin-nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ypbin-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ypbin-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: ypbin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ypbin_admin
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ypbin-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 说明：Sentinel Dashboard 由 starter 的 deploy 提供（从官方 jar 自构建，
  # 镜像 ypbin/sentinel-dashboard:1.8.8），本文件不重复编排；如需限流控制台，
  # 先执行 starter 的 docker-compose.yml 或单独构建 sentinel-dashboard。

  # ---------- 微服务 ----------
  ypbin-gateway:
    build:
      context: ../ypbin-gateway
    image: ypbin/ypbin-gateway:local
    container_name: ypbin-gateway
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
    ports:
      - "18080:18080"
    depends_on:
      - nacos
    restart: unless-stopped

  ypbin-auth:
    build:
      context: ../ypbin-auth
    image: ypbin/ypbin-auth:local
    container_name: ypbin-auth
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
    ports:
      - "18081:18081"
    depends_on:
      - nacos
      - redis
    restart: unless-stopped

  ypbin-system:
    build:
      context: ../ypbin-service/ypbin-system
    image: ypbin/ypbin-system:local
    container_name: ypbin-system
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
    ports:
      - "18082:18082"
    depends_on:
      - nacos
      - mysql
    restart: unless-stopped

  ypbin-ai:
    build:
      context: ../ypbin-service/ypbin-ai
    image: ypbin/ypbin-ai:local
    container_name: ypbin-ai
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
      AI_MODEL_SECRET_KEY: ${AI_MODEL_SECRET_KEY:?请在 deploy/.env 设置 AI_MODEL_SECRET_KEY（16/24/32 字节）}
    ports:
      - "18083:18083"
    depends_on:
      - nacos
      - mysql
    restart: unless-stopped

  ypbin-job:
    build:
      context: ../ypbin-service/ypbin-job
    image: ypbin/ypbin-job:local
    container_name: ypbin-job
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
    ports:
      - "18084:18084"
    depends_on:
      - nacos
      - mysql
    restart: unless-stopped

  # ---------- XXL-JOB 调度中心（独立中间件，任务调度/日志 UI）----------
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:3.4.2
    container_name: ypbin-xxl-job-admin
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD} --server.port=8080"
    ports:
      - "18085:8080"
    depends_on:
      - mysql
    restart: unless-stopped

  # ---------- 前端 ----------
  ypbin-admin-ui:
    image: nginx:alpine
    container_name: ypbin-admin-ui
    volumes:
      - ${ADMIN_UI_DIST_DIR:-../admin-ui-dist}:/usr/share/nginx/html:ro
      - ./nginx-microservice.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ADMIN_UI_PORT:-19000}:80"
    depends_on:
      - ypbin-gateway
    restart: unless-stopped

volumes:
  ypbin-redis-data:
  ypbin-mysql-data:
  ypbin-nacos-data:
