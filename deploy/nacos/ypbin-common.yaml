# ============================================================
# ypbin-admin 微服务共享配置（Nacos 配置中心）
# 部署时在 Nacos 创建本配置（Data ID: ypbin-common.yaml，Group: DEFAULT_GROUP），
# 各服务通过 spring.config.import: optional:nacos:ypbin-common.yaml 引入。
# 本地开发无需 Nacos 配置中心：optional 前缀使缺失时静默跳过，回退服务本地 yml 默认值。
#
# 说明：
#  - ${SENTINEL_ADDR:localhost:8858} 占位符由各服务进程环境解析（Nacos 不解析）
#  - 服务本地 yml 已含连接 Nacos 必需的最小配置（nacos.server-addr），此处不再重复
# ============================================================

spring:
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_ADDR:localhost:8858}
