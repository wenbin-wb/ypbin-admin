# ============================================================
# ypbin-system 服务配置（Nacos 配置中心）
# Data ID: ypbin-system.yaml | Group: DEFAULT_GROUP | 格式: YAML
# ============================================================

# ---------- 租户/数据权限 ----------
ypbin:
  tenant:
    enabled: true
    # 不做租户隔离的全局表（与单体版对齐）
    ignore-tables:
      - sys_menu
      - sys_tenant
      - sys_user_role
      - sys_role_menu
      - sys_dict
      - sys_dict_item
      - sys_config
      - sys_user_password_history
      - sys_log
      - sys_client
      - sys_user_post
      - sys_role_dept
      - sys_file
      - sys_job
      - sys_job_log
      - sys_app
      - sys_user_social
      - sys_auth_template
      - sys_template_menu
      - sys_license
  data-permission:
    enabled: true
  # 本应用是授权签发端，不启用 starter License 自保护
  license:
    enabled: false

# ---------- 安全（开放接口与内部 Feign 端点免登录拦截）----------
  security:
    # system 为下游业务服务，登录态由网关校验并注入身份头；
    # 关闭本地 Sa-Token 全局拦截，避免 system 直读 Redis 会话导致 token 无效。
    interceptor: false
    excludes:
      - /open/license/**
      - /open-api/**
      - /internal/**
      - /actuator/**

# ---------- 接口签名（开放 API 示例）----------
  sign:
    enabled: true
    mode: ANNOTATION

# ---------- SSE 推送 ----------
  sse:
    enabled: true

# ---------- XXL-JOB 执行器（分布式任务调度）----------
# xxl-job: 启用前需先部署 xxl-job-admin 调度中心；执行器端口需在容器/网络可达
#   xxl-job:
#     enabled: true
#     admin-addresses: http://xxl-job-admin:8080/xxl-job-admin
#     access-token: ""
#     appname: ypbin-system
#     port: 9999
