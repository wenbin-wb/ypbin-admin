# ============================================================
# ypbin-auth 服务配置（Nacos 配置中心）
# Data ID: ypbin-auth.yaml | Group: DEFAULT_GROUP | 格式: YAML
# ============================================================

# ---------- 安全（公开端点免登录校验，与网关白名单一致）----------
# 注意：网关 StripPrefix 已剥掉短名段，此处为服务实际收到的路径（纯资源路径）
ypbin:
  security:
    excludes:
      - /login
      - /sms/send
      - /sms/login
      - /social/authorize/**
      - /social/callback/**
      - /social/platforms
      - /captcha
      - /captcha/verify
      - /actuator/**

# ---------- Feign 身份来源校验（与 system/ai 同口径）----------
  cloud:
    feign:
      trusted-source-token: ${GATEWAY_SIGN_TOKEN}
      require-trusted-source: true

# ---------- 操作日志（ypbin-starter-log）----------
# 登录日志的采集项：与 ypbin-system.yaml 口径一致，显式追加 BROWSER/OS，否则 sys_log 的
# browser/os 两列恒为空（starter 默认只采 REQUEST_PARAM/IP/CLIENT）。
# 刻意不追加 REQUEST_BODY：登录请求体含明文密码，落库即泄露。代价是登录日志无法记录"谁登录"，
# 该字段缺口属已知边界（sys_log 无 username 列，匿名请求也没有身份头）。
  log:
    enabled: true
    includes:
      - REQUEST_PARAM
      - IP
      - CLIENT
      - BROWSER
      - OS

# ---------- SSE（ypbin-starter-messaging）----------
# 刻意不配 ypbin.sse：auth 没有任何 SSE 消费方（无 PushService / SseEmitterManager / SseTicketStore 引用）。
# 该开关一旦为 true，starter 会为这个用不到的能力装配整套 SSE——SseEmitterManager、Redis 跨实例扇出
# 订阅线程，并暴露 /ypbin/sse/subscribe 与 /ypbin/sse/ticket 两个 HTTP 端点
# （SseAutoConfiguration 的两个 @Bean 在 register-endpoint 默认 true 且容器存在 SseUserIdResolver 时注册；
# auth 引入 starter-security 后该条件实际满足）。保持默认 false 即不装配。
# 注意：auth 依赖 ypbin-starter-messaging 的真实原因只是 SmsUtils（见 pom 注释），与 SSE 无关。

# ---------- 埋点（ypbin-starter-tracking）----------
# 登录/登出事件（auth.user.login / auth.user.logout）由本服务产出——三个登录入口都在 auth，
# 必须在此打开开关，否则 auth 不装配采集链路，漏斗里的「登录」这一步恒为空（只留一行 WARN）。
# 落库去向：auth 无数据源，事件经 ypbin-common 的 RemoteTrackEventSink 上报 system 的
# /internal/track-ingest，再到 sys_track_event（该端点走内部凭证，不经网关）。
# 刻意不开 ingest-enabled：auth 不是客户端事件的上报入口（那是 system 的 /tracking/ingest），
# 不开就少一个匿名可写端点。
  tracking:
    enabled: true
    app-id: ypbin-admin-auth
