# ============================================================
# ypbin-auth 服务配置（Nacos 配置中心）
# Data ID: ypbin-auth.yaml | Group: DEFAULT_GROUP | 格式: YAML
# ============================================================

# ---------- 安全（公开端点免登录校验，与网关白名单一致）----------
ypbin:
  security:
    excludes:
      - /auth/login
      - /auth/sms/send
      - /auth/sms/login
      - /auth/social/authorize/**
      - /auth/social/callback/**
      - /auth/social/platforms
      - /captcha
      - /captcha/verify
      - /actuator/**

# ---------- SSE 推送 ----------
  sse:
    enabled: true
