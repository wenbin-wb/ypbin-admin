# ============================================================
# ypbin-gateway 服务配置（Nacos 配置中心）
# Data ID: ypbin-gateway.yaml | Group: DEFAULT_GROUP | 格式: YAML
# ============================================================

# Sa-Token 与 auth 保持一致，确保网关能读取 Redis 中的登录会话
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: 1800
  auto-renew: true
  is-read-cookie: false
  is-print: false

# Spring Cloud 2025.1.2 官方支持 Boot 4.1.x，兼容性检查器元数据滞后误报，显式禁用
spring:
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            # 约定：每个服务对外唯一主段 = 服务业务域；新增 controller 一律挂主段下，无需改本表
            - id: auth
              uri: lb://ypbin-auth
              predicates:
                # 认证域：登录/登出/验证码/当前用户/我的菜单/权限码
                - Path=/auth/**,/captcha/**
            - id: system
              uri: lb://ypbin-system
              predicates:
                # 系统域：RBAC/文件/公告/仪表盘/站内信/个人中心 + 开放/许可/Sse 匿名段
                - Path=/system/**,/open-api/**,/open/license/**,/ypbin/**
            - id: ai
              uri: lb://ypbin-ai
              predicates:
                # AI 域：对话/知识库/模型 + 公网分享/挂件匿名段
                - Path=/ai/**,/share/**,/widget/**

# 统一鉴权：校验 token 后清洗外部头、签发内部身份头
ypbin:
  gateway:
    auth:
      enabled: true
      # 白名单路径（无需登录即可访问）
      exclude-paths:
        - /auth/login
        - /auth/sms/send
        - /auth/sms/login
        - /auth/social/authorize/**
        - /auth/social/callback/**
        - /auth/social/platforms
        - /captcha/**
        - /open-api/**
        - /open/license/**
        - /share/**
        - /widget/**
        # SSE 订阅：EventSource 无法携带 Authorization，靠一次性 ticket 换身份（ticket 由登录态签发）
        - /ypbin/sse/subscribe
