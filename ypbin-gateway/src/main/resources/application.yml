server:
  port: 18080

spring:
  application:
    name: ypbin-gateway
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
        enabled: true
    sentinel:
      transport:
        dashboard: ${SENTINEL_ADDR:localhost:8858}
    gateway:
      discovery:
        locator:
          enabled: true          # 按服务名自动路由：/ypbin-auth-service/** → auth 服务
          lower-case-service-id: true
      routes:
        - id: auth
          uri: lb://ypbin-auth
          predicates:
            - Path=/auth/**,/captcha/**,/user/**,/open-api/**
        - id: system
          uri: lb://ypbin-system
          predicates:
            - Path=/system/**
        - id: ai
          uri: lb://ypbin-ai
          predicates:
            - Path=/ai/**,/share/**,/widget/**

# 统一鉴权：校验 token 后清洗外部头、签发内部身份头（CONTRACT.md §6）
ypbin:
  gateway:
    auth:
      enabled: true
      # 白名单路径（无需登录即可访问）
      whitelist:
        - /auth/login
        - /auth/social/**
        - /captcha/**
        - /open-api/**
        - /open/license/**
        - /share/**
        - /widget/**
