server:
  port: 18081

spring:
  application:
    name: ypbin-auth
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      # Nacos 服务端开启鉴权后客户端必须带账号（deploy/docker-compose.yml 注入）
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
  config:
    import:
      - optional:nacos:ypbin-common.yaml
      - optional:nacos:ypbin-auth.yaml
