server:
  port: 18081

spring:
  application:
    name: ypbin-auth
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
        enabled: true
    sentinel:
      transport:
        dashboard: ${SENTINEL_ADDR:localhost:8858}

ypbin:
  tenant:
    enabled: true
  data-permission:
    enabled: true
