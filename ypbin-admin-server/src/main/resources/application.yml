server:
  port: 8080

spring:
  application:
    name: ypbin-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ypbin_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

# Sa-Token 配置
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000          # 固定有效期 30 天
  active-timeout: 1800      # 活跃超时 30 分钟
  auto-renew: true          # 活跃用户自动续期
  is-read-cookie: false     # 不从 cookie 读 token
  is-print: false

# ypbin-starter 配置
ypbin:
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      real-name: ${ADMIN_BOOTSTRAP_REAL_NAME:平台管理员}
      tenant-id: ${ADMIN_BOOTSTRAP_TENANT_ID:1}
    job:
      reconcile-delay: ${ADMIN_JOB_RECONCILE_DELAY:30000}
  web:
    repeatable-read:
      enabled: true           # 启用签名模块需读取请求体，必须开启
    cors:
      enabled: true
      allowed-origin-patterns:
        - "http://localhost:*"
        - "http://43.242.200.8:*"
        - "https://*.ypbin.cn"
        - "http://*.ypbin.cn"
    xss:
      enabled: true
      excludes: ["/webhook/**"]
  security:
    interceptor: true
    excludes:               # 放行路径（无需登录）
      - /auth/login
      - /auth/sms/send
      - /auth/sms/login
      - /auth/social/authorize/**
      - /auth/social/callback/**
      - /auth/social/platforms
      - /captcha
      - /captcha/verify
      - /open/license/**
      - /error
  tenant:
    enabled: true
    column: tenant_id
    ignore-tables:          # 不做租户隔离的全局表
      - sys_menu
      - sys_tenant
      - sys_user_role
      - sys_role_menu
      - sys_dict
      - sys_dict_item
      - sys_config
      - sys_user_password_history
      - sys_log
      - sys_client
      - sys_user_post
      - sys_role_dept
      - sys_file
      - sys_job
      - sys_job_log
      - sys_app
      - sys_user_social
      - sys_auth_template
      - sys_template_menu
      - sys_license
  sign:
    enabled: true              # 开启接口签名
    mode: ANNOTATION           # 仅 @ApiSign 标注的接口校验签名
  license:
    enabled: false             # 本应用是授权签发端（供应方），自身不做 License 自保护
    issuer:                    # 签发密钥经环境变量注入，不落库；首次可调用 /system/license/generate-key 生成
      public-key: ${LICENSE_ISSUER_PUBLIC_KEY:}
      private-key: ${LICENSE_ISSUER_PRIVATE_KEY:}
      sm4-key: ${LICENSE_ISSUER_SM4_KEY:}
  log:
    includes:                  # 操作日志全局采集项：默认(参数/IP/客户端) + 浏览器/操作系统
      - REQUEST_PARAM
      - IP
      - CLIENT
      - BROWSER
      - OS
    access:
      enabled: true            # 全量访问日志（打印到应用日志，非落库），与 @Log 操作日志互补
      exclude-path-patterns:   # 不记流水的路径：健康检查、接口文档、静态资源
        - /actuator/**
        - /doc.html
        - /swagger-ui/**
        - /v3/api-docs/**
        - /webjars/**
        - /favicon.ico
  data-permission:
    enabled: true
  async:
    enabled: true
  sse:
    enabled: true

# tianai-captcha 原生配置：验证码有效期（默认 20 秒太短，拉长到 60 秒）
captcha:
  expire:
    default: 60000
  sensitive-words:
    replacement: '*'            # 敏感词替换字符
  i18n:
    enabled: true               # 国际化，按请求参数 lang 或请求头 Accept-Language
  api-crypto:
    key: ${API_CRYPTO_KEY:}     # 接口加解密 AES 密钥由部署环境注入
  # TODO 待部署阶段接入：当前 admin 未引入 ypbin-starter-cloud-observability 模块，
  # 以下 observability 配置无自动配置支撑（空配，不生效）。反哺 starter 提供单体可用的可观测性能力后再启用。
  observability:
    enabled: true
    request-id-header: X-Request-Id
    mdc-key: requestId
  api-doc:
    enabled: true
    title: ypbin-admin API
    description: 企业级后台管理系统接口文档
    version: 1.0.0
    contact:
      name: wenbin

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
  level:
    cn.ypbin.admin: debug

# TODO 待部署阶段接入：当前未引入 spring-boot-starter-actuator，以下 management 配置不生效，
# /actuator/health 返回 404（非鉴权问题）。计划反哺 starter 由 observability 模块统一提供
# actuator + health 端点 + 自动放行 /actuator/health（复用 SecurityExcludePathProvider 机制），
# admin 引入模块后再启用；届时放行须精确到 health，勿放 env/beans/heapdump 等敏感端点。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
