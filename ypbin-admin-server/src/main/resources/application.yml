server:
  port: 8080

spring:
  application:
    name: ypbin-admin
  threads:
    virtual:
      enabled: true   # JDK 21 虚拟线程：Tomcat 请求线程池切换为虚拟线程，提升 I/O 密集场景并发吞吐
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ypbin_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration
    encoding: UTF-8

# Sa-Token 配置
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000          # 固定有效期 30 天
  active-timeout: 1800      # 活跃超时 30 分钟
  auto-renew: true          # 活跃用户自动续期
  is-read-cookie: false     # 不从 cookie 读 token
  is-print: false

# ypbin-starter 配置
ypbin:
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      real-name: ${ADMIN_BOOTSTRAP_REAL_NAME:平台管理员}
      tenant-id: ${ADMIN_BOOTSTRAP_TENANT_ID:1}
    job:
      reconcile-delay: ${ADMIN_JOB_RECONCILE_DELAY:30000}
  web:
    repeatable-read:
      enabled: true           # 启用签名模块需读取请求体，必须开启
    cors:
      enabled: false
      # 默认关闭 CORS,同源访问(nginx 代理/同端口)无需跨域,保证一键部署可用
      # 如需跨域,通过环境变量 YPBIN_WEB_CORS_ENABLED=true + YPBIN_WEB_CORS_ALLOWED_ORIGIN_PATTERNS 开启
      allowed-origin-patterns:
        - "http://localhost:*"
    xss:
      enabled: true
      excludes: ["/webhook/**"]
  security:
    interceptor: true
    excludes:               # 放行路径（无需登录）
      - /auth/login
      - /auth/sms/send
      - /auth/sms/login
      - /auth/social/authorize/**
      - /auth/social/callback/**
      - /auth/social/platforms
      - /captcha
      - /captcha/verify
      - /open/license/**
      - /actuator/health   # 健康检查放行（仅此低危端点，不放 env/beans 等）
      - /error
  tenant:
    enabled: true
    column: tenant_id
    ignore-tables:          # 不做租户隔离的全局表
      - sys_menu
      - sys_tenant
      - sys_user_role
      - sys_role_menu
      - sys_dict
      - sys_dict_item
      - sys_config
      - sys_user_password_history
      - sys_log
      - sys_client
      - sys_user_post
      - sys_role_dept
      - sys_file
      - sys_job
      - sys_job_log
      - sys_app
      - sys_user_social
      - sys_auth_template
      - sys_template_menu
      - sys_license
  sign:
    enabled: true              # 开启接口签名
    mode: ANNOTATION           # 仅 @ApiSign 标注的接口校验签名
  license:
    enabled: false             # 本应用是授权签发端（供应方），自身不做 License 自保护
    issuer:                    # 签发密钥经环境变量注入，不落库；首次可调用 /system/license/generate-key 生成
      public-key: ${LICENSE_ISSUER_PUBLIC_KEY:}
      private-key: ${LICENSE_ISSUER_PRIVATE_KEY:}
      sm4-key: ${LICENSE_ISSUER_SM4_KEY:}
  log:
    includes:                  # 操作日志全局采集项：默认(参数/IP/客户端) + 浏览器/操作系统
      - REQUEST_PARAM
      - IP
      - CLIENT
      - BROWSER
      - OS
    access:
      enabled: true            # 全量访问日志（打印到应用日志，非落库），与 @Log 操作日志互补
      exclude-path-patterns:   # 不记流水的路径：健康检查、接口文档、静态资源
        - /actuator/**
        - /doc.html
        - /swagger-ui/**
        - /v3/api-docs/**
        - /webjars/**
        - /favicon.ico
  data-permission:
    enabled: true
  async:
    enabled: true
  sse:
    enabled: true
  sensitive-words:
    enabled: true               # 启用敏感词过滤（替换字符见下）
    replacement: '*'            # 敏感词替换字符
    words:                      # 敏感词库（演示/测试用，可按需增删；DFA 匹配，命中即替换为 *)
      - 赌博
      - 色情
      - 裸聊
      - 代开发票
      - 违禁
      - 非法集资
      - 传销
      - 邪教
      - 毒品
      - 军火
      - 假证
      - 刷单
      - 博彩
      - 洗钱
      - 枪支
      - 爆炸物
      - 黑客
      - 木马
      - 病毒
      - 盗号
      - 外挂
      - 作弊
      - 代考
      - 裸贷
      - 高利贷
      - 赌博网站
      - 招嫖
      - 军警
      - 港独
      - 台独
      - 藏独
      - 疆独
  i18n:
    enabled: true               # 国际化，按请求参数 lang 或请求头 Accept-Language
  api-crypto:
    key: ${API_CRYPTO_KEY:}     # 接口加解密 AES 密钥由部署环境注入
  api-doc:
    enabled: true
    title: ypbin-admin API
    description: 企业级后台管理系统接口文档
    version: 1.0.0
    contact:
      name: wenbin
  # TODO 待部署阶段接入：当前 admin 未引入 ypbin-starter-cloud-observability 模块，
  # 以下 observability 配置无自动配置支撑（空配，不生效）。反哺 starter 提供单体可用的可观测性能力后再启用。
  observability:
    enabled: true
    request-id-header: X-Request-Id
    mdc-key: requestId
  # ypbin AI 能力配置：模型经「AI 配置」页管理（默认模型动态构建 OpenAI 兼容客户端），
  # 无需在 yml 配置模型 starter；ypbin.ai.enabled=true 启用对话/记忆/RAG 等能力
  ai:
    enabled: true                              # 启用 AI 模块
    chat:
      enabled: true
      default-system-prompt: "你是 ypbin-admin 的 AI 助手，请用简洁清晰的中文回答。"
      rag-enabled: false                       # 全局 RAG（普通对话也检索向量库），需 rag.enabled=true
      # 历史消息窗口统一由 memory.window-size 控制（AiChatProperties 无 windowSize 字段，勿在此添加死键）
    memory:
      type: jdbc                               # jdbc 持久化会话（推荐），或 in-memory
      window-size: 10                          # 记忆窗口大小
    rag:
      enabled: true                            # SimpleVectorStore 内存向量库（无外部依赖）
      top-k: 5
      similarity-threshold: 0.5               # 中文语义向量建议 0.5（0.7 过高会过滤掉有效召回）
      max-context-length: 8000                 # 检索上下文最大字符数
      simple-store-path: ${AI_SIMPLE_STORE_PATH:data/ai/simple-vector-store.json}  # 向量持久化文件（重启不丢）
    model-config:
      secret-key: ${AI_MODEL_SECRET_KEY:}      # API Key 加密密钥（16/24/32 字节），生产必须注入

# tianai-captcha 原生配置：验证码有效期（默认 20 秒太短，拉长到 60 秒）
captcha:
  expire:
    default: 60000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
  level:
    cn.ypbin.admin: debug

# Spring Boot Actuator：健康检查与应用信息。仅暴露 health/info 两个低危端点，
# 不放 env/beans/heapdump 等敏感端点。health 需登录放行（见 ypbin.security.excludes）。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

