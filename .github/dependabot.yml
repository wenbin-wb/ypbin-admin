version: 2
updates:
  # 监控 Maven 依赖安全漏洞（open-pull-requests-limit: 0 仅后台告警，不自动创建 PR 分支）
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  # 监控 GitHub Actions 版本安全
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
