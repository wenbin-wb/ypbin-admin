name: CodeQL

on:
  push:
    branches: [ main, boot, feature/miniapp-backend ]
  pull_request:
    branches: [ main, boot, feature/miniapp-backend ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL 静态安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin ]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 🔴 2026-11-22 加：清掉 Maven 缓存里的「外来仓库标记」，否则本地 install starter 必然失败。
      # 根因同 ci.yml：setup-java 的 cache: maven 把开发机 ~/.m2/repository 的 _remote.repositories
      # （记录来源 repo id，本机为 aliyun=）带到 runner，runner 只有 central ⇒ Resolver 判
      # 「present, but unavailable」且失败被缓存 ⇒ 静态扫描连库都建不起来（假红，非漏洞）。
      - name: 清理 Maven 缓存里的外来仓库标记（防「present, but unavailable」假红）
        run: |
          set -uo pipefail
          repo="$HOME/.m2/repository"
          # 冷缓存时该目录可能不存在：find 会以非零退出，配 set -e 会让整步失败（2026-11-22 实测 run #557）。
          mkdir -p "$repo"
          n=$(find "$repo" -name '_remote.repositories' -type f 2>/dev/null | wc -l || true)
          echo "命中 _remote.repositories 标记文件：${n:-0} 个"
          find "$repo" -name '_remote.repositories' -type f -delete 2>/dev/null || true
          m=$(find "$repo" -name '*.lastUpdated' -type f 2>/dev/null | wc -l || true)
          echo "命中 *.lastUpdated 失败缓存：${m:-0} 个"
          find "$repo" -name '*.lastUpdated' -type f -delete 2>/dev/null || true
          echo "清理完成"


      - name: 检出 ypbin-starter（提供依赖）
        uses: actions/checkout@v4
        with:
          repository: wenbin-wb/ypbin-starter
          ref: master
          path: ypbin-starter

      - name: 本地安装 ypbin-starter
        run: mvn -B clean install -DskipTests -Djacoco.skip=true
        working-directory: ypbin-starter

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: 构建（生成 CodeQL 数据库）
        run: mvn -B clean compile -DskipTests -Djacoco.skip=true

      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v4
