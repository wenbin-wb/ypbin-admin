name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 自动发布 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出 ypbin-admin 代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 检出 ypbin-starter（提供依赖）
        uses: actions/checkout@v4
        with:
          repository: wenbin-wb/ypbin-starter
          ref: master
          path: ypbin-starter

      - name: 本地安装 ypbin-starter
        run: mvn -B clean install -DskipTests
        working-directory: ypbin-starter

      - name: 全量测试与构建校验
        run: mvn -B clean verify

      - name: 提取 Release Notes 并发布 Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
