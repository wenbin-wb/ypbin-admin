name: CI

on:
  push:
    branches: [ main, feature/spring-ai ]
  pull_request:

jobs:
  build:
    name: 构建与校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 编译、代码风格校验与测试
        run: mvn -B clean verify
