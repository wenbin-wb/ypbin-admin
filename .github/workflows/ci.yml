name: CI

on:
  push:
    branches: [ main, boot, feature/miniapp-backend ]
  pull_request:
    branches: [ main, boot, feature/miniapp-backend ]

jobs:
  build:
    name: 构建与校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出 ypbin-admin 代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 校验 starter 依赖版本为最新 Release（防版本漂移）
        run: |
          REQ=$(grep -oP '(?<=<ypbin-starter.version>)[^<]+' pom.xml)
          LATEST=$(curl -fsSL https://api.github.com/repos/wenbin-wb/ypbin-starter/releases/latest | grep -oP '"tag_name":\s*"v\K[^"]+')
          echo "admin 依赖 starter ${REQ}，最新 Release v${LATEST}"
          [ "$REQ" = "$LATEST" ] || { echo "依赖版本落后，请升级至最新 Release"; exit 1; }

      - name: 检出 ypbin-starter（版本以 admin pom 的 ypbin-starter.version 为准）
        uses: actions/checkout@v4
        with:
          repository: wenbin-wb/ypbin-starter
          ref: master
          path: ypbin-starter

      - name: 本地安装 ypbin-starter
        run: mvn -B clean install -DskipTests -Djacoco.skip=true
        working-directory: ypbin-starter

      - name: Nacos 导入前「live-only 键」检查工具自测
        # 与 iot 同源机制：install.sh 导入前比对新旧键，防「整份覆盖静默删除线上独有键」。
        # 工具纯标准库实现（不依赖 PyYAML），自测覆盖嵌套键/注释/序列/白名单/JSON 解包等。
        run: python3 tools/nacos-live-only-diff.py --self-test

      - name: 编译、代码风格校验与测试
        run: mvn -B clean verify
