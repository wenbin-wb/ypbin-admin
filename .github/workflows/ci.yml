name: CI

on:
  push:
    branches: [ main, feature/spring-ai ]
  pull_request:

jobs:
  build:
    name: 构建与校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出 ypbin-admin 代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 检出 ypbin-starter（提供 SNAPSHOT 依赖）
        uses: actions/checkout@v4
        with:
          repository: wenbin-wb/ypbin-starter
          ref: feature/spring-ai
          path: ypbin-starter

      - name: 本地安装 ypbin-starter
        run: mvn -B clean install -DskipTests
        working-directory: ypbin-starter

      - name: 编译、代码风格校验与测试
        run: mvn -B clean verify

