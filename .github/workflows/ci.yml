name: CI

on:
  push:
    branches: [ main, boot, feature/miniapp-backend ]
  pull_request:
    branches: [ main, boot, feature/miniapp-backend ]

jobs:
  build:
    name: 构建与校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出 ypbin-admin 代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 🔴 2026-11-22 加：清掉缓存里的「外来仓库标记」，否则本地 install starter 必然失败（假红）。
      # 根因（一手日志，run #551）：setup-java 的 cache: maven 会把开发机的 ~/.m2/repository 整体缓存，
      # 每个制品目录的 _remote.repositories 记录来源 repo id（本机 settings.xml 配了 aliyun 镜像 ⇒ 标记为
      # aliyun=），runner 上只有 central ⇒ Resolver 判为「present, but unavailable」且缓存失败不再重试，
      # 直接报 Non-resolvable import POM: spring-boot-dependencies:pom:4.1.2 (present, but unavailable)。
      # 这些版本在 Central 真实存在（2026-11-21 实测 6 个 BOM 全部 HTTP 200）⇒ 纯缓存污染假红。
      # 与 fork ypbin-iot 的同一处修复（该仓 IoT Integration Tests 已因此转绿）。
      - name: 清理 Maven 缓存里的外来仓库标记（防「present, but unavailable」假红）
        run: |
          set -uo pipefail
          repo="$HOME/.m2/repository"
          # 冷缓存时该目录可能不存在：find 会以非零退出，配 set -e 会让整步失败（2026-11-22 实测）。
          mkdir -p "$repo"
          n=$(find "$repo" -name '_remote.repositories' -type f 2>/dev/null | wc -l || true)
          echo "命中 _remote.repositories 标记文件：${n:-0} 个"
          find "$repo" -name '_remote.repositories' -type f -delete 2>/dev/null || true
          m=$(find "$repo" -name '*.lastUpdated' -type f 2>/dev/null | wc -l || true)
          echo "命中 *.lastUpdated 失败缓存：${m:-0} 个"
          find "$repo" -name '*.lastUpdated' -type f -delete 2>/dev/null || true
          echo "清理完成"

      - name: 校验 starter 依赖版本为最新 Release（防版本漂移）
        run: |
          REQ=$(grep -oP '(?<=<ypbin-starter.version>)[^<]+' pom.xml)
          LATEST=$(curl -fsSL https://api.github.com/repos/wenbin-wb/ypbin-starter/releases/latest | grep -oP '"tag_name":\s*"v\K[^"]+')
          echo "admin 依赖 starter ${REQ}，最新 Release v${LATEST}"
          [ "$REQ" = "$LATEST" ] || { echo "依赖版本落后，请升级至最新 Release"; exit 1; }

      - name: 检出 ypbin-starter（版本以 admin pom 的 ypbin-starter.version 为准）
        uses: actions/checkout@v4
        with:
          repository: wenbin-wb/ypbin-starter
          ref: master
          path: ypbin-starter

      - name: 本地安装 ypbin-starter
        run: mvn -B clean install -DskipTests -Djacoco.skip=true
        working-directory: ypbin-starter

      - name: Nacos 导入前「live-only 键」检查工具自测
        # 与 iot 同源机制：install.sh 导入前比对新旧键，防「整份覆盖静默删除线上独有键」。
        # 工具纯标准库实现（不依赖 PyYAML），自测覆盖嵌套键/注释/序列/白名单/JSON 解包等。
        run: python3 tools/nacos-live-only-diff.py --self-test

      - name: 编译、代码风格校验与测试
        run: mvn -B clean verify
