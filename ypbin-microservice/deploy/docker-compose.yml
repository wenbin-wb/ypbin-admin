# ypbin-admin 微服务版本地部署环境
#
# 用法：
#   docker compose -f deploy/docker-compose.yml up -d
#
# 说明：基础设施（Nacos/Redis/MySQL/Sentinel）由 starter 的 deploy 提供或复用；
# 本文件编排微服务四件套 + 网关。账号密码一律从 .env 注入。

services:
  ypbin-gateway:
    build:
      context: ../ypbin-gateway
    image: ypbin/ypbin-gateway:local
    container_name: ypbin-gateway
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
    ports:
      - "18080:18080"
    depends_on:
      - nacos
    restart: unless-stopped

  ypbin-auth:
    build:
      context: ../ypbin-auth
    image: ypbin/ypbin-auth:local
    container_name: ypbin-auth
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ypbin_admin
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
    ports:
      - "18081:18081"
    depends_on:
      - nacos
      - mysql
    restart: unless-stopped

  ypbin-system:
    build:
      context: ../ypbin-service/ypbin-system
    image: ypbin/ypbin-system:local
    container_name: ypbin-system
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ypbin_admin
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
    ports:
      - "18082:18082"
    depends_on:
      - nacos
      - mysql
    restart: unless-stopped

  ypbin-ai:
    build:
      context: ../ypbin-service/ypbin-ai
    image: ypbin/ypbin-ai:local
    container_name: ypbin-ai
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ypbin_admin
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
    ports:
      - "18083:18083"
    depends_on:
      - nacos
      - mysql
    restart: unless-stopped

  ypbin-job:
    build:
      context: ../ypbin-service/ypbin-job
    image: ypbin/ypbin-job:local
    container_name: ypbin-job
    environment:
      NACOS_ADDR: nacos:8848
      SENTINEL_ADDR: sentinel-dashboard:8858
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ypbin_admin
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
    ports:
      - "18084:18084"
    depends_on:
      - nacos
      - mysql
    restart: unless-stopped
