server:
  port: 18082

spring:
  application:
    name: ypbin-system
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      # Nacos 服务端开启鉴权后客户端必须带账号（deploy/docker-compose.yml 注入）
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
  config:
    import:
      - optional:nacos:ypbin-common.yaml
      - optional:nacos:ypbin-system.yaml

ypbin:
  security:
    super-admin:
      # 部署时由 install.sh 随机生成并注入（compose 透传 SUPER_ADMIN_INIT_PASSWORD）；
      # 为空则保留种子口令，仍由 pwd_change_required 强制首登改密
      init-password: ${SUPER_ADMIN_INIT_PASSWORD:}
